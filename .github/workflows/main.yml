name: CI Pipeline
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/docker-build.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  hadolint:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/hadolint.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  fossa-scan:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/fossa-scan.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  analysis:
    if: github.repository_owner == 'omec-project'
    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      drives: read
      id-token: write
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: write
      statuses: read
      vulnerability-alerts: read
    uses: omec-project/.github/.github/workflows/scorecard-analysis.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
